name: Update

on:
  watch:
    types: [started]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-auto-update-iptv]

permissions:
  contents: write

env:
  TZ: Asia/Ho_Chi_Minh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: GetTime
      run: echo "DATE=$(date +'%Y-%m-%d %H:%M:%S GMT+7')" >> $GITHUB_ENV

    - name: Update Playlist and EPG
      run: |
        # --- Kaynakların İndirilmesi ---
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Wall/refs/heads/main/output_clean.m3u -O Sport1.m3u || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Stalker2M3U/refs/heads/1/Football_match_live.m3u -O Football_match_live.m3u || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Stalker2M3U/refs/heads/1/live_schedule_Optimize.m3u -O live_schedue.m3u || true
        
        # GitLab kaynakları (Maç özetleri ve kanallar)
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/mac_ozetleri.m3u8?ref_type=heads -O mac_ozetleri.m3u || true
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/kanallar7.m3u8?ref_type=heads -O kanallar7.m3u || true
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/kanallar4.m3u8?ref_type=heads -O kanallar4.m3u || true

        # --- Kaynakların Birleştirilmesi ---
        rm -f IPTV.m3u && touch IPTV.m3u
        cat Sport1.m3u >> IPTV.m3u || true
        cat Football_match_live.m3u >> IPTV.m3u || true
        cat live_schedue.m3u >> IPTV.m3u || true
        cat mac_ozetleri.m3u >> IPTV.m3u || true
        cat kanallar7.m3u >> IPTV.m3u || true
        cat kanallar4.m3u >> IPTV.m3u || true

        # --- Python ile Akıllı Gruplandırma ve Temizlik ---
        python3 - << 'EOF'
        import re

        try:
            with open('IPTV.m3u', 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()

            def replace_group(match):
                extinf_line = match.group(0)
                gt_match = re.search(r'group-title="([^"]*)"', extinf_line, re.IGNORECASE)
                
                # Varsayılan kategori
                new_group = '📺 Diğer Kanallar'
                
                # Eski grubu veya tüm satırı analiz et (anahtar kelime bazlı eşleştirme)
                text_to_check = extinf_line.lower()
                if gt_match:
                    text_to_check = gt_match.group(1).lower() + " " + text_to_check

                if any(k in text_to_check for k in ['spor', 'sport', 'maç', 'match', 'futbol', 'football', 'liga', 'champions', 'f1', 'basket', 'nba', 'özet', 'ozet', 'bein', 'tnt sport', 'sky sport', 's Sport']):
                    new_group = '⚽ Spor & Maçlar'
                elif any(k in text_to_check for k in ['film', 'movie', 'sinema', 'box', 'vod', 'dizi', 'cinema']):
                    new_group = '🎬 Filmler & Diziler'
                elif any(k in text_to_check for k in ['vtv', 'ulusal', 'yerel', 'türkiye', 'turk', 'haber', 'news', 'kanal']):
                    new_group = '📺 Ulusal Kanallar'
                elif any(k in text_to_check for k in ['belgesel', 'docu', 'animal', 'history', 'travel', 'du-lich', 'khám phá', 'discovery']):
                    new_group = '🌍 Belgesel & Yaşam'
                elif any(k in text_to_check for k in ['cocuk', 'kids', 'çocuk', 'animasyon', 'cartoon']):
                    new_group = '👶 Çocuk'

                # Mevcut group-title'ı güncelle veya yoksa ekle
                if gt_match:
                    extinf_line = re.sub(r'group-title="[^"]*"', f'group-title="{new_group}"', extinf_line, flags=re.IGNORECASE)
                else:
                    extinf_line = extinf_line.replace('#EXTINF:', f'#EXTINF:-1 group-title="{new_group}"')
                return extinf_line

            # #EXTINF bloklarını bul ve düzenle
            new_content = re.sub(r'(#EXTINF:-?[\d\.\s].*?)(?=\n|$)', replace_group, content)

            # Temizlik ve en üste EPG ekleme
            lines = new_content.splitlines()
            cleaned_lines = [l for l in lines if l.strip() and not l.startswith('#EXTM3U')]
            
            final_output = '#EXTM3U url-tvg="https://raw.githubusercontent.com/Love4vn/Test/refs/heads/main/EPG.xml"\n' + '\n'.join(cleaned_lines)

            with open('IPTV.m3u', 'w', encoding='utf-8') as f:
                f.write(final_output)
            print("Gruplandırma başarıyla tamamlandı.")
        except Exception as e:
            print(f"Hata oluştu: {e}")
        EOF

        # --- EPG (Program Rehberi) Kaynakları ---
        rm -f EPG.xml EPG1.xml EPG2.xml EPG3.xml EPG4.xml EPG.xml.gz
        wget -q --show-progress --no-check-certificate https://lichphatsong.site/schedule/epg.xml.gz -O EPG.xml.gz || true
        if [ -f EPG.xml.gz ]; then
            gunzip -f EPG.xml.gz || true
        fi
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/PhatBee/phatbeetv/refs/heads/main/merged_epg.xml -O EPG1.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/bakulwifi/Epglive/refs/heads/main/epg.xml -O EPG2.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/BuddyChewChew/tv/refs/heads/default/M3U8/TV.xml -O EPG3.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Mikoshi-nyudo/dlhd/refs/heads/main/epgs/daddylive-channels-epg.xml -O EPG4.xml || true
        
        # Geçici dosyaların temizlenmesi
        rm -f Sport1.m3u Football_match_live.m3u live_schedue.m3u mac_ozetleri.m3u kanallar7.m3u kanallar4.m3u EPG1.xml EPG2.xml EPG3.xml EPG4.xml || true

    - name: Commit and Push Changes
      run: |
        git config --local user.email "Love4vn@gmail.com"
        git config --local user.name "Love4vn"
        
        git add IPTV.m3u EPG.xml
        
        if git diff --staged --quiet; then
          echo "🟡 No changes to commit"
          exit 0
        fi
        
        git commit -m "🔄 Auto-update IPTV and optimize groups at $DATE [skip ci]"
        git pull --rebase origin main || true
        git push origin main
