name: Update

on:
  watch:
    types: [started]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-auto-update-iptv]

permissions:
  contents: write

env:
  TZ: Asia/Ho_Chi_Minh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: GetTime
      run: echo "DATE=$(date +'%Y-%m-%d %H:%M:%S GMT+7')" >> $GITHUB_ENV

    - name: Update Playlist and EPG
      run: |
        # --- Kaynakların İndirilmesi ---
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Wall/refs/heads/main/output_clean.m3u -O Sport1.m3u || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Stalker2M3U/refs/heads/1/Football_match_live.m3u -O Football_match_live.m3u || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Love4vn/Stalker2M3U/refs/heads/1/live_schedule_Optimize.m3u -O live_schedue.m3u || true
        
        # Eklediğiniz yeni kaynaklar (GitLab linkleri)
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/mac_ozetleri.m3u8?ref_type=heads -O mac_ozetleri.m3u || true
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/kanallar7.m3u8?ref_type=heads -O kanallar7.m3u || true
        wget -q --show-progress --no-check-certificate https://gitlab.com/mstfblkn006/listeler/-/raw/main/kanallar4.m3u8?ref_type=heads -O kanallar4.m3u || true

        # --- Kaynakların Birleştirilmesi ---
        rm -f IPTV.m3u && touch IPTV.m3u
        cat Sport1.m3u >> IPTV.m3u || true
        cat Football_match_live.m3u >> IPTV.m3u || true
        cat live_schedue.m3u >> IPTV.m3u || true
        
        # Yeni eklenen kaynakları IPTV.m3u dosyasına dahil ediyoruz
        cat mac_ozetleri.m3u >> IPTV.m3u || true
        cat kanallar7.m3u >> IPTV.m3u || true
        cat kanallar4.m3u >> IPTV.m3u || true

        # --- Temizlik ve Metin Düzenlemeleri ---
        sed -i '/#EXTM3U/d' IPTV.m3u || true
        
        sed -i 's/"Kênh VTV"/"🇻🇳📺| Kênh VTV"/g;s/"Thể Thao"/"⚽🥎| Thể Thao"/g;s/"Giải Trí"/"🎬😜|Giải Trí"/g' IPTV.m3u
        sed -i 's/group-title="KÊNH DÀNH CHO GIA ĐÌNH"/ /g;s/group-title="KÊNH ĐẶC SẮC"/ /g;s/group-title="KÊNH PHIM TRUYỆN"/ /g;s/group-title="KÊNH GIẢI TRÍ"/ /g;s/group-title="KÊNH TIN TỨC"/ /g' IPTV.m3u
        sed -i 's/group-title="KNH C SC"/ /g;s/group-title="KNH C NHIU LT XEM CAO NHT"/ /g;s/group-title="KNH GII TR"/ /g;s/group-title="KNH DY HC"/ /g' IPTV.m3u
        sed -i 's/"KÊNH BOX"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"KNH K"/"K Channels"/g;s/"Minh c Gii Tr"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"In The Box"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"TH NGHIM"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"FPT Play"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"Truyn Hnh"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"Quc T HD"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"K"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"Quc T"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"Quc t"/"🔍🔒ᴹᵒᵛⁱᵉˢ📣🎬😜"/g;s/"🎬😜 Phim 🔍📣"/"🎬🎞️ 🅼🅾🆅🅸🅴 🔍📣"/g;s/"Phim"/"🎬🎞️ 🅼🅾🆅🅸🅴 🔍📣"/g;s/"KÊNH THIẾT YẾU"/"🇻🇳📺| Kênh VTV 📢"/g;s/"Thit yu"/"🇻🇳📺| Kênh VTV 📢"/g;s/"VTV"/"🇻🇳📺| Kênh VTV 📢"/g;s/"VTV 50fsp"/"🇻🇳📺| Kênh VTV 📢"/g;s/"Kenh VTV"/"🇻🇳📺| Kênh VTV 📢"/g;s/"❤| VTV"/"🇻🇳📺| Kênh VTV 📢"/g;s/"🇻🇳📺| Nhóm Kênh VTV 📢"/"🇻🇳📺| Kênh VTV 📢"/g;s/VTVCanTho/VTV Cần Thơ/g;s/VTV5 Ty Nam B/VTV5 Tây Nam Bộ/g;s/VTV5 Ty Nguyn/VTV5 Tây Nguyên/g;s/❤️| VTV6 ¹⁰⁸⁰/❤️| VTV6 Cần Thơ ¹⁰⁸⁰/g;s/"Khm ph"/"Du lịch-Khám phá"/g;s/"Lifestyle"/"Du lịch-Khám phá"/g;s/"Du lchKhm ph"/"Du lịch-Khám phá"/g;s/"Animals Nature History"/"Du lịch-Khám phá"/g;s/"247"/"Du lịch-Khám phá"/g;s/"Movie"/"🎬🎞️ 🅼🅾🆅🅸🅴 🔍📣"/g;s/"Movies"/"🎬🎞️ 🅼🅾🆅🅸🅴 🔍📣"/g;s/"Relax"/"😜✨| Relax 😋"/g;s/"Comedy"/"😜✨| Relax 😋"/g;s/"Kids"/"Nhóm Kênh Thiếu Nhi "/g;s/"Selection Sport"/"🎯🔔|Selection Sport|🔔🎯"/g;s/"Trc tip Euro 2024"/"🔥🔥⚽| Euro 2024"/g;s/"Livestream"/"⚽🥎Livestream🏆🏅"/g;s/咪咕 推荐/Migu Recommend/g;s/"世界女排联赛"/"🎊Foreign Sports🎊"/g;s/"浪琴国家杯"/"🎊Foreign Sports🎊"/g;s/"NBA"/"🎊Foreign Sports🎊"/g;s/"🥅外欧洲杯🥅"/"🥅⚽️European Cup⚽️🥅"/g;s/ช่อง/Channel/g' IPTV.m3u

        # İstenmeyen kanalların filtrelenmesi
        sed -i '/"Myanmar Tv"/{N; /"Myanmar Tv"/d;};/TH H NI 1 HD/{N; /TH H NI 1 HD/d;};/HYTV HD TH BO HNG YN/{N; /HYTV HD TH BO HNG YN/d;};/ANTV TH AN NINH HD/{N; /ANTV TH AN NINH HD/d;};/HueTV TH THNH PH HU HD/{N; /HueTV TH THNH PH HU HD/d;};/TH H NI 2 4K/{N; /TH H NI 2 4K/d;}' IPTV.m3u
        sed -i '/央视频道/{N; /央视频道/d;};/卫视频道/{N; /卫视频道/d;};/湖北频道/{N; /湖北频道/d;};/其他频道/{N; /其他频道/d;};/河南频道/{N; /河南频道/d;};/北京频道/{N; /北京频道/d;};/港澳频道/{N; /港澳频道/d;};/湖南频道/{N; /湖南频道/d;};/台湾频道/{N; /台湾频道/d;};/上海频道/{N; /上海频道/d;};/🐉国内体育🐉/{N; /🐉国内体育🐉/d;};/🎰央视卫视🎰/{N; /🎰央视卫视🎰/d;};/咪咕体育/{N; /咪咕体育/d;};/"世预亚 中国vs韩国"/{N; /"世预亚 中国vs韩国"/d;}' IPTV.m3u

        # En üst başlığın ve EPG bağlantısının eklenmesi
        sed -i '1i #EXTM3U url-tvg="https://raw.githubusercontent.com/Love4vn/Test/refs/heads/main/EPG.xml"' IPTV.m3u
        sed -i '/^\s*$/d' IPTV.m3u

        # --- EPG (Program Rehberi) Kaynakları ---
        rm -f EPG.xml EPG1.xml EPG2.xml EPG3.xml EPG4.xml EPG.xml.gz
        wget -q --show-progress --no-check-certificate https://lichphatsong.site/schedule/epg.xml.gz -O EPG.xml.gz || true
        if [ -f EPG.xml.gz ]; then
            gunzip -f EPG.xml.gz || true
        fi
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/PhatBee/phatbeetv/refs/heads/main/merged_epg.xml -O EPG1.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/bakulwifi/Epglive/refs/heads/main/epg.xml -O EPG2.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/BuddyChewChew/tv/refs/heads/default/M3U8/TV.xml -O EPG3.xml || true
        wget -q --show-progress --no-check-certificate https://raw.githubusercontent.com/Mikoshi-nyudo/dlhd/refs/heads/main/epgs/daddylive-channels-epg.xml -O EPG4.xml || true
        
        # Geçici dosyaların temizlenmesi
        rm -f Sport1.m3u Football_match_live.m3u live_schedue.m3u mac_ozetleri.m3u kanallar7.m3u kanallar4.m3u EPG1.xml EPG2.xml EPG3.xml EPG4.xml || true

    - name: Commit and Push Changes
      run: |
        git config --local user.email "Love4vn@gmail.com"
        git config --local user.name "Love4vn"
        
        git add IPTV.m3u EPG.xml
        
        if git diff --staged --quiet; then
          echo "🟡 No changes to commit"
          exit 0
        fi
        
        git commit -m "🔄 Auto-update IPTV at $DATE [skip ci]"
        git pull --rebase origin main || true
        git push origin main
