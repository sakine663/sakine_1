name: Selcuk M3U Otomatik Uretici

on:
  workflow_dispatch: # GitHub panelinden manuel çalıştırmak için
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalıştırmak için

jobs:
  build:
    runs-on: ubuntu-latest
    
    # GitHub Actions'ın deponuza yazma (commit/push) izni olması için:
    permissions:
      contents: write

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install beautifulsoup4 urllib3 requests

      - name: Betiği Çalıştır ve M3U Üret
        run: |
          python nilo.py

      - name: Oluşan M3U Dosyasını Kaydet / Commit Et
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          
          # Uzaktaki olası değişiklikleri güvenli bir şekilde al ve çakışmayı önle
          git pull origin main --rebase || true
          
          # Üretilen M3U dosyasını ekle (Python kodunuzdaki OUTPUT_FILENAME = "channels.m3u" ile aynı olmalıdır)
          git add channels.m3u
          
          git commit -m "Otomatik M3U Güncellemesi [skip ci]" || exit 0
          
          # Değişiklikleri depoya gönder
          git push origin main
