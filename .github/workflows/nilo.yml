name: Selcuk M3U Otomatik Uretici

on:
  workflow_dispatch: # Manuel olarak GitHub panelinden "Run workflow" diyerek çalıştırabilmek için
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik olarak çalıştırır

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install beautifulsoup4 urllib3 requests

      - name: Betiği Çalıştır ve M3U Üret
        run: |
          python nilo.py # Betiğinizin adını buraya yazın

      - name: Oluşan M3U Dosyasını Kaydet / Commit Et
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add channels.m3u
          git commit -m "Otomatik M3U Güncellemesi [skip ci]" || exit 0
          git push
