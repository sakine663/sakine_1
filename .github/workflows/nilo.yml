name: Günlük Kanal Tarama ve Güncelleme

on:
  schedule:
    # Her gün Türkiye saati ile sabah 06:00'da çalışır (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Ayarla
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python Betiğini Çalıştır
        run: python script.py # Betik dosyanızın adı ne ise onunla değiştirebilirsiniz

      - name: Değişiklikleri Git ile Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nilo.json nilo.m3u
          git diff --staged --quiet || git commit -m "Otomatik kanal listesi güncellemesi (nilo.m3u) 🤖"
          git push