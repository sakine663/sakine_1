name: Selcuk M3U Otomatik Güncelleme

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install requests urllib3

      - name: Python Betiğini Çalıştır (M3U Üret)
        run: |
          python serby.py

      - name: Değişiklikleri Kaydet ve GitHub'a Yükle
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selcuk.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Otomatik M3U Güncellemesi [skip ci]" && git push)
