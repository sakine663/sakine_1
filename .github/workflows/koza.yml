name: Günlük Koza.m3u Güncelleyici

on:
  schedule:
    # Her 6 saatte bir çalıştırır (cron UTC saat dilimine göredir)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manuel olarak Actions sekmesinden tetiklenebilmesini sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # GitHub deposuna dosya commit edebilmek için yazma izni

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Python Scriptini Çalıştır
        run: python koza.py # 'script.py' kısmını kendi python dosya adınızla değiştirebilirsiniz

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Koza.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik M3U Güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')" && git push)