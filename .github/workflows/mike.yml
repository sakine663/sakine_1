name: Selenium M3U8 Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install requests selenium webdriver-manager
          # Eğer selenium-wire kullanacaksanız ekleyin:
          # pip install selenium-wire

      - name: Google Chrome ve ChromeDriver Kur
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: latest

      - name: Scripti Çalıştır
        run: python mike.py # Python dosyanızın adı neyse onu yazın

      - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u stats.json logs/
          git diff --staged --quiet || git commit -m "Otomatik M3U8 listesi güncellendi [skip ci]"
          git push